name: Validar regras C#

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Combate, progressão, perfis e kart
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Instalar SDK .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Executar suite externa sem licença Unity
        shell: pwsh
        run: ./tools/run-validation.ps1 -SkipUnity -OutputDirectory ./Builds/Validation/ci
      - name: Preservar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-validation
          path: |
            Builds/Validation/ci/*.log
            Builds/Validation/ci/validation.json
          if-no-files-found: warn
